<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X Post Screenshot Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0f0f0f;
    color: #fff;
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px 60px;
  }

  h1 {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #555;
    margin-bottom: 36px;
  }

  .layout {
    display: flex;
    gap: 40px;
    width: 100%;
    max-width: 1100px;
    align-items: flex-start;
  }

  /* ── EDITOR PANEL ── */
  .editor {
    flex: 0 0 340px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .field-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #666;
  }

  input[type="text"],
  textarea {
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 8px;
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    padding: 10px 12px;
    width: 100%;
    resize: none;
    outline: none;
    transition: border-color 0.15s;
    line-height: 1.5;
  }
  input[type="text"]:focus,
  textarea:focus { border-color: #444; }

  textarea { min-height: 120px; }

  .row {
    display: flex;
    gap: 12px;
  }
  .row .field-group { flex: 1; }

  input[type="number"] {
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 8px;
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    padding: 10px 12px;
    width: 100%;
    outline: none;
    transition: border-color 0.15s;
    -moz-appearance: textfield;
  }
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }
  input[type="number"]:focus { border-color: #444; }

  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .toggle {
    position: relative;
    width: 40px;
    height: 22px;
  }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle .slider {
    position: absolute;
    inset: 0;
    background: #333;
    border-radius: 22px;
    cursor: pointer;
    transition: 0.2s;
  }
  .toggle .slider::before {
    content: '';
    position: absolute;
    width: 16px; height: 16px;
    left: 3px; top: 3px;
    background: #fff;
    border-radius: 50%;
    transition: 0.2s;
  }
  .toggle input:checked + .slider { background: #1d9bf0; }
  .toggle input:checked + .slider::before { transform: translateX(18px); }

  /* Avatar upload */
  .avatar-upload-area {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .avatar-preview {
    width: 52px; height: 52px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid #333;
    flex-shrink: 0;
    background: #222;
  }
  .upload-btn {
    flex: 1;
    background: #1a1a1a;
    border: 1px dashed #333;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 12px;
    color: #888;
    cursor: pointer;
    text-align: center;
    transition: border-color 0.15s, color 0.15s;
  }
  .upload-btn:hover { border-color: #555; color: #ccc; }
  #avatar-file { display: none; }

  /* gradient ring selector */
  .ring-options {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .ring-opt {
    width: 30px; height: 30px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    transition: border-color 0.15s;
    flex-shrink: 0;
  }
  .ring-opt.active { border-color: #fff; }
  .ring-opt[data-ring="none"] { background: #333; }
  .ring-opt[data-ring="rainbow"] { background: conic-gradient(red, orange, yellow, green, blue, indigo, violet, red); }
  .ring-opt[data-ring="fire"] { background: conic-gradient(#ff6b00, #ffd200, #ff0000, #ff6b00); }
  .ring-opt[data-ring="ocean"] { background: conic-gradient(#00b4d8, #0077b6, #90e0ef, #00b4d8); }
  .ring-opt[data-ring="gold"] { background: conic-gradient(#f7971e, #ffd200, #f7971e); }

  /* views format */
  .views-row { display: flex; gap: 8px; align-items: center; }
  .views-suffix {
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 8px;
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    padding: 10px 12px;
    outline: none;
    cursor: pointer;
  }

  /* Download btn */
  .download-btn {
    width: 100%;
    padding: 13px;
    background: #1d9bf0;
    border: none;
    border-radius: 9999px;
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    margin-top: 4px;
  }
  .download-btn:hover { background: #1a8cd8; }
  .download-btn:active { transform: scale(0.98); }

  /* ── PREVIEW PANEL ── */
  .preview-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .preview-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #444;
    align-self: flex-start;
  }

  /* The actual post card — this is what gets exported */
  #post-card {
    background: #000;
    width: 600px;
    padding: 20px 20px 0 20px;
    font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
    position: relative;
    overflow: hidden;
    border-radius: 0;
  }

  /* Header row: ← Post … */
  .post-chrome-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 18px;
    border-bottom: 1px solid #1f1f1f;
    margin-bottom: 18px;
  }
  .chrome-left {
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .chrome-arrow {
    color: #fff;
    font-size: 22px;
    line-height: 1;
    font-weight: 300;
  }
  .chrome-title {
    font-size: 20px;
    font-weight: 700;
    color: #fff;
  }
  .chrome-dots {
    font-size: 22px;
    color: #fff;
    letter-spacing: 2px;
  }

  /* Author row */
  .author-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    gap: 14px;
  }
  .author-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  /* Avatar canvas (ring + image drawn via JS) */

  /* Name + handle */
  .name-wrap {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .display-name-row {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .display-name {
    font-size: 17px;
    font-weight: 800;
    color: #fff;
    line-height: 1.2;
  }
  .verified-badge {
    width: 20px; height: 20px;
    flex-shrink: 0;
  }
  .handle {
    font-size: 15px;
    color: #71767b;
    font-weight: 400;
  }

  .post-dots {
    font-size: 20px;
    color: #fff;
    letter-spacing: 2px;
    align-self: flex-start;
    margin-top: 2px;
    flex-shrink: 0;
  }

  /* Post text */
  .post-text {
    font-size: 28px;
    font-weight: 800;
    color: #fff;
    line-height: 1.35;
    margin-bottom: 28px;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* Timestamp + views */
  .meta-row {
    border-top: 1px solid #1f1f1f;
    padding: 14px 0 16px;
    font-size: 15px;
    color: #71767b;
    font-weight: 400;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .meta-dot { font-size: 4px; color: #71767b; vertical-align: middle; margin: 0 2px; }
  .meta-views-count { color: #fff; font-weight: 700; }

  /* Divider line at very bottom */
  .bottom-divider {
    border-top: 1px solid #1f1f1f;
    height: 1px;
  }

  /* Responsive */
  @media (max-width: 820px) {
    .layout { flex-direction: column; align-items: center; }
    .editor { flex: none; width: 100%; max-width: 480px; }
    #post-card { width: 100%; max-width: 520px; }
  }
</style>
</head>
<body>

<h1>X Post Screenshot Generator</h1>

<div class="layout">

  <!-- ── EDITOR ── -->
  <div class="editor">

    <!-- Avatar -->
    <div class="field-group">
      <label>Profile Photo</label>
      <div class="avatar-upload-area">
        <img id="avatar-preview-img" class="avatar-preview" src="" alt="avatar">
        <div class="upload-btn" onclick="document.getElementById('avatar-file').click()">
          Click to upload photo
        </div>
        <input type="file" id="avatar-file" accept="image/*">
      </div>
    </div>

    <!-- Avatar gradient ring -->
    <div class="field-group">
      <label>Avatar Ring</label>
      <div class="ring-options">

        <div class="ring-opt" data-ring="rainbow" title="Rainbow"></div>
        <div class="ring-opt" data-ring="fire" title="Fire"></div>

    <!-- Name / Handle -->
    <div class="row">
      <div class="field-group">
        <label>Display Name</label>
        <input type="text" id="inp-name" value="Yashodeep" placeholder="Display Name">
      </div>
      <div class="field-group">
        <label>@Handle</label>
        <input type="text" id="inp-handle" value="ykacholiya" placeholder="handle">
      </div>
    </div>

    <!-- Verified badge toggle -->
    <div class="field-group">
      <div class="toggle-row">
        <label>Blue Verified Badge</label>
        <label class="toggle">
          <input type="checkbox" id="inp-verified" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <!-- Post text -->
    <div class="field-group">
      <label>Post Text</label>
      <textarea id="inp-text">Your POSS subscription isn't the problem.

Your onboarding process is.</textarea>
    </div>

    <!-- Time & Date -->
    <div class="row">
      <div class="field-group">
        <label>Time</label>
        <input type="text" id="inp-time" value="" placeholder="7:48 PM">
      </div>
      <div class="field-group">
        <label>Date</label>
        <input type="text" id="inp-date" value="" placeholder="May 20, 2025">
      </div>
    </div>

    <!-- Views -->
    <div class="field-group">
      <label>Views</label>
      <div class="row">
        <input type="text" id="inp-views" value="" placeholder="264.1K" style="flex:1">
      </div>
    </div>

    <button class="download-btn" onclick="downloadImage()">⬇ Download PNG</button>
  </div>

  <!-- ── PREVIEW ── -->
  <div class="preview-wrap">
    <div class="preview-label">Live Preview</div>
    <div id="post-card">

      <!-- Chrome header -->
      <div class="post-chrome-header">
        <div class="chrome-left">
          <span class="chrome-arrow">←</span>
          <span class="chrome-title">Post</span>
        </div>
        <span class="chrome-dots">···</span>

      <!-- Author -->
      <div class="author-row">
        <div class="author-left">
          <!-- Avatar ring -->
          <canvas id="avatar-canvas" width="120" height="120" style="width:60px;height:60px;border-radius:50%;flex-shrink:0;"></canvas>
          <!-- Name/handle -->
          <div class="name-wrap">
            <div class="display-name-row">
              <span class="display-name" id="out-name">Yashodeep</span>
              <svg class="verified-badge" id="out-badge" viewBox="0 0 24 24" aria-label="Verified account" role="img" xmlns="http://www.w3.org/2000/svg">
                <g>
                  <path d="M22.25 12c0-1.43-.88-2.67-2.19-3.34.46-1.39.2-2.9-.81-3.91s-2.52-1.27-3.91-.81c-.66-1.31-1.91-2.19-3.34-2.19s-2.67.88-3.33 2.19c-1.4-.46-2.91-.2-3.92.81s-1.26 2.52-.8 3.91c-1.31.67-2.2 1.91-2.2 3.34s.89 2.67 2.2 3.34c-.46 1.39-.21 2.9.8 3.91s2.52 1.26 3.91.81c.67 1.31 1.91 2.19 3.34 2.19s2.68-.88 3.34-2.19c1.39.45 2.9.2 3.91-.81s1.27-2.52.81-3.91c1.31-.67 2.19-1.91 2.19-3.34zm-11.71 4.2L6.8 12.46l1.41-1.42 2.26 2.26 4.8-5.23 1.47 1.36-6.2 6.77z" fill="#1d9bf0"/>
                </g>
              </svg>
            </div>
            <span class="handle" id="out-handle">@ykacholiya</span>

        <span class="post-dots">···</span>

      <!-- Post body -->

Your onboarding process is.</div>

      <!-- Meta -->
      <div class="meta-row">
        <span id="out-time"></span>
        <span class="meta-dot">●</span>
        <span id="out-date"></span>
        <span class="meta-dot">●</span>
        <span><span class="meta-views-count" id="out-views"></span> Views</span>

      <div class="bottom-divider"></div>

    </div><!-- /post-card -->
  </div>

</div><!-- /layout -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>

// ── State ──
let avatarDataUrl = null;
let currentRing = 'none';

// Ring color stops for canvas drawing
const RING_STOPS = {
  none:    null,
  rainbow: ['#ff0000','#ff7700','#ffee00','#00ff00','#0077ff','#8800ff','#ff0000'],
  fire:    ['#ff6b00','#ffd200','#ff0000','#ff6b00'],
  ocean:   ['#00b4d8','#0077b6','#90e0ef','#00b4d8'],
  gold:    ['#f7971e','#ffd200','#ffcc00','#f7971e'],
};

// Draw ring + avatar onto the single canvas
function renderAvatarCanvas(canvas, imgSrc, ring) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const cx = w / 2, cy = h / 2;
  const outerR = w / 2;
  const ringThickness = w * 0.07;   // ~8px at 120px canvas
  const gapThickness  = w * 0.035;  // ~4px black gap
  const photoR = outerR - ringThickness - gapThickness;

  ctx.clearRect(0, 0, w, h);

  // 1. Draw gradient ring (or solid dark if none)
  const stops = RING_STOPS[ring];
  if (stops) {
    const grad = ctx.createConicGradient(0, cx, cy);
    stops.forEach((color, i) => grad.addColorStop(i / (stops.length - 1), color));
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, outerR, 0, Math.PI * 2);
    ctx.fill();
  } else {
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(cx, cy, outerR, 0, Math.PI * 2);
    ctx.fill();
  }

  // 2. Black gap ring
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(cx, cy, outerR - ringThickness, 0, Math.PI * 2);
  ctx.fill();

  // 3. Draw photo clipped to inner circle
  if (imgSrc) {
    const img = new Image();
    img.onload = () => {
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, photoR, 0, Math.PI * 2);
      ctx.clip();
      const size = photoR * 2;
      ctx.drawImage(img, cx - photoR, cy - photoR, size, size);
      ctx.restore();
    };
    img.src = imgSrc;
  } else {
    // Placeholder silhouette
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, photoR, 0, Math.PI * 2);
    ctx.clip();
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, w, h);
    ctx.restore();
  }
}

// drawAvatarImage: kept for compatibility — delegates to renderAvatarCanvas
function drawAvatarImage(canvas, imgSrc) {
  renderAvatarCanvas(canvas, imgSrc, currentRing);
}

function applyRing(ring) {
  currentRing = ring;
  const canvas = document.getElementById('avatar-canvas');
  renderAvatarCanvas(canvas, avatarDataUrl, ring);
}

// ── Bindings ──
function bind(id, outId, transform) {
  const inp = document.getElementById(id);
  const out = document.getElementById(outId);
  inp.addEventListener('input', () => {
    out[transform === 'handle' ? 'textContent' : 'textContent'] =
      transform === 'handle' ? '@' + inp.value.replace(/^@/, '') : inp.value;
  });
}

document.getElementById('inp-name').addEventListener('input', e => {
  document.getElementById('out-name').textContent = e.target.value;
});
document.getElementById('inp-handle').addEventListener('input', e => {
  document.getElementById('out-handle').textContent = '@' + e.target.value.replace(/^@/, '');
});
document.getElementById('inp-text').addEventListener('input', e => {
  document.getElementById('out-text').textContent = e.target.value;
});
document.getElementById('inp-time').addEventListener('input', e => {
  document.getElementById('out-time').textContent = e.target.value;
});
document.getElementById('inp-date').addEventListener('input', e => {
  document.getElementById('out-date').textContent = e.target.value;
});
document.getElementById('inp-views').addEventListener('input', e => {
  document.getElementById('out-views').textContent = e.target.value;
});
document.getElementById('inp-verified').addEventListener('change', e => {
  document.getElementById('out-badge').style.display = e.target.checked ? 'block' : 'none';
});

// Avatar file
document.getElementById('avatar-file').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    avatarDataUrl = ev.target.result;
    document.getElementById('avatar-preview-img').src = avatarDataUrl;
    drawAvatarImage(document.getElementById('avatar-canvas'), avatarDataUrl);
  };
  reader.readAsDataURL(file);
});

// Ring selector
document.querySelectorAll('.ring-opt').forEach(el => {
  el.addEventListener('click', () => {
    document.querySelectorAll('.ring-opt').forEach(o => o.classList.remove('active'));
    el.classList.add('active');
    currentRing = el.dataset.ring;
    applyRing(currentRing);
  });
});

// ── Download ──
async function downloadImage() {
  const card = document.getElementById('post-card');
  const btn = document.querySelector('.download-btn');
  btn.textContent = 'Generating…';
  btn.disabled = true;

  try {
    const canvas = await html2canvas(card, {
      backgroundColor: '#000000',
      scale: 3,
      useCORS: true,
      logging: false,
      allowTaint: true,
    });
    const link = document.createElement('a');
    link.download = 'x-post.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  } catch(err) {
    alert('Could not generate image. Try uploading a local photo.');
    console.error(err);
  } finally {
    btn.textContent = '⬇ Download PNG';
    btn.disabled = false;
  }
}

// ── Helpers ──
function getCurrentTime() {
  const now = new Date();
  let h = now.getHours(), m = now.getMinutes();
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return `${h}:${String(m).padStart(2, '0')} ${ampm}`;
}

function getCurrentDate() {
  const now = new Date();
  return now.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
}

function randomViews() {
  // Random between 150,000 and 300,000
  const raw = Math.floor(Math.random() * (300000 - 150000 + 1)) + 150000;
  // Format as e.g. 264.1K
  return (raw / 1000).toFixed(1) + 'K';
}

function setField(inpId, outId, value, isHandle) {
  const inp = document.getElementById(inpId);
  const out = document.getElementById(outId);
  inp.value = value;
  out.textContent = isHandle ? '@' + value : value;
}

// ── Init ──
